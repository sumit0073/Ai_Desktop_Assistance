# Builds System Bunny as downloadable macOS .dmg files (Apple Silicon + Intel)
# and attaches them to a GitHub Release — similar to sharing an Android APK.
#
# Trigger: Actions → "Build macOS DMG" → Run workflow
# Download: repo Releases page, or the workflow run Artifacts

name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    name: Build ${{ matrix.label }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
            label: Apple Silicon
          - target: x86_64-apple-darwin
            arch: x86_64
            label: Intel Mac

    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Create frontend env for Vite build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_GROQ_API_KEY: ${{ secrets.VITE_GROQ_API_KEY }}
          VITE_GROQ_MODEL: ${{ vars.VITE_GROQ_MODEL }}
          VITE_GROQ_VISION_MODEL: ${{ vars.VITE_GROQ_VISION_MODEL }}
        run: |
          {
            echo "VITE_SUPABASE_URL=${VITE_SUPABASE_URL:-}"
            echo "VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY:-}"
            echo "VITE_GROQ_API_KEY=${VITE_GROQ_API_KEY:-}"
            echo "VITE_GROQ_MODEL=${VITE_GROQ_MODEL:-openai/gpt-oss-20b}"
            echo "VITE_GROQ_VISION_MODEL=${VITE_GROQ_VISION_MODEL:-qwen/qwen3.8-27b}"
          } > .env

      - name: Install frontend dependencies
        run: npm ci

      - name: Build macOS DMG
        env:
          # Ad-hoc signing so Apple Silicon builds are not marked "damaged"
          APPLE_SIGNING_IDENTITY: "-"
        # Pass args after `--` so npm forwards a string argv to the tauri CLI
        # (not a nested JS array). Only bundle dmg for downloadable installers.
        run: npm run tauri -- build --target "${{ matrix.target }}" --bundles dmg

      - name: Locate DMG
        id: dmg
        run: |
          shopt -s nullglob
          files=(src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No DMG found under src-tauri/target/${{ matrix.target }}/release/bundle/dmg/"
            find src-tauri/target -name '*.dmg' -print || true
            exit 1
          fi
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"
          echo "Found DMG: ${files[0]}"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemBunny-macOS-${{ matrix.arch }}
          # Single path string (not a YAML array) — avoids path/type mismatches
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: build-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Read app version
        id: ver
        run: echo "version=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Download all DMG artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: SystemBunny-macOS-*
          path: dist-dmg
          merge-multiple: true

      - name: List release files
        run: find dist-dmg -type f -name '*.dmg' -print

      - name: Create GitHub Release with DMGs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ steps.ver.outputs.version }}
          name: System Bunny v${{ steps.ver.outputs.version }}
          body: |
            Download a `.dmg` below and open it on your Mac.

            - **Apple Silicon** (M1/M2/M3/M4): file name contains `aarch64`
            - **Intel Mac**: file name contains `x64` or `x86_64`

            First open: right-click the app → **Open** (unsigned / ad-hoc signed build).
          # Glob string (not a YAML/JS array) — softprops splits on newlines/spaces
          files: dist-dmg/*.dmg
          fail_on_unmatched_files: true
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
