# Builds System Bunny for Windows (.exe / .msi) and macOS (.dmg)
# and publishes downloadable installers on a GitHub Release.
#
# How to ship a new release (v0.1.9+):
#   1. Push version bump to main (package.json / tauri.conf / Cargo.toml already synced).
#   2. Actions → "Build Desktop Installers" → Run workflow
#   3. version: leave empty (uses repo version) OR set explicitly e.g. 0.1.9
#   4. note: optional human release title
#   5. Wait for Windows + macOS jobs → publishes GitHub Release tag app-v*
#
# Download: repo Releases page, or the workflow run Artifacts
#
# Required repository secrets:
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY,
#   VITE_STT_PROXY_URL, VITE_CHAT_PROXY_URL
# Optional repository secrets / variables:
#   VITE_GOOGLE_CLIENT_ID (Google Sign-In in release builds)
#   VITE_GROQ_MODEL, VITE_GROQ_VISION_MODEL

name: Build Desktop Installers

on:
  # Actions → Build Desktop Installers → Run workflow
  # Builds Windows (.exe/.msi) + macOS (.dmg) and publishes GitHub Release app-v*
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.9). Leave empty to use the version already in the repo."
        required: false
        type: string
        default: ""
      note:
        description: "Release title (shown on the GitHub Release). Leave empty for a plain version title."
        required: false
        type: string
        default: ""
  push:
    tags:
      - "v*"

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows x64
    permissions:
      contents: read
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Release note
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.note != '' }}
        run: echo "::notice title=Release note::${{ inputs.note }}"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Apply release version
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
        shell: bash
        run: node scripts/bump-version.mjs "${{ inputs.version }}"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: desktop-windows-x64

      - name: Create frontend env for Vite build
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STT_PROXY_URL: ${{ secrets.VITE_STT_PROXY_URL }}
          VITE_CHAT_PROXY_URL: ${{ secrets.VITE_CHAT_PROXY_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GROQ_MODEL: ${{ vars.VITE_GROQ_MODEL }}
          VITE_GROQ_VISION_MODEL: ${{ vars.VITE_GROQ_VISION_MODEL }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_SUPABASE_URL:-}" ] || [ -z "${VITE_SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY secrets." >&2
            exit 1
          fi
          if [ -z "${VITE_STT_PROXY_URL:-}" ] || [ -z "${VITE_CHAT_PROXY_URL:-}" ]; then
            echo "Missing VITE_STT_PROXY_URL or VITE_CHAT_PROXY_URL secrets." >&2
            exit 1
          fi
          {
            echo "VITE_SUPABASE_URL=${VITE_SUPABASE_URL}"
            echo "VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}"
            echo "VITE_STT_PROXY_URL=${VITE_STT_PROXY_URL}"
            echo "VITE_CHAT_PROXY_URL=${VITE_CHAT_PROXY_URL}"
            echo "VITE_GROQ_MODEL=${VITE_GROQ_MODEL:-openai/gpt-oss-20b}"
            echo "VITE_GROQ_VISION_MODEL=${VITE_GROQ_VISION_MODEL:-qwen/qwen3.8-27b}"
            if [ -n "${VITE_GOOGLE_CLIENT_ID:-}" ]; then
              echo "VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}"
            fi
          } > .env
          if grep -Eiq 'GROQ_API_KEY|ALLOW_DIRECT_GROQ' .env; then
            echo "Refusing to build: client .env must not contain Groq secrets." >&2
            exit 1
          fi

      - name: Install frontend dependencies
        run: npm ci

      - name: Quality gates
        shell: bash
        run: npm run ci:quality

      - name: Build Windows installers (NSIS + MSI)
        run: npm run tauri -- build --bundles nsis,msi

      - name: Stage installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-win | Out-Null
          $nsis = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue
          if (-not $nsis -and -not $msi) {
            Write-Error "No Windows installer found."
            Get-ChildItem -Recurse "src-tauri/target/release/bundle" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName }
            exit 1
          }
          if ($nsis) { Copy-Item $nsis.FullName -Destination dist-win/ }
          if ($msi) { Copy-Item $msi.FullName -Destination dist-win/ }
          Get-ChildItem dist-win | Format-Table Name, Length

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemBunny-Windows-x64
          path: dist-win
          if-no-files-found: error

  build-macos:
    name: macOS ${{ matrix.label }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: aarch64
            label: Apple Silicon
          - target: x86_64-apple-darwin
            arch: x86_64
            label: Intel
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Apply release version
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
        run: node scripts/bump-version.mjs "${{ inputs.version }}"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: desktop-${{ matrix.target }}

      - name: Create frontend env for Vite build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_STT_PROXY_URL: ${{ secrets.VITE_STT_PROXY_URL }}
          VITE_CHAT_PROXY_URL: ${{ secrets.VITE_CHAT_PROXY_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GROQ_MODEL: ${{ vars.VITE_GROQ_MODEL }}
          VITE_GROQ_VISION_MODEL: ${{ vars.VITE_GROQ_VISION_MODEL }}
        run: |
          set -euo pipefail
          if [ -z "${VITE_SUPABASE_URL:-}" ] || [ -z "${VITE_SUPABASE_ANON_KEY:-}" ]; then
            echo "Missing VITE_SUPABASE_URL or VITE_SUPABASE_ANON_KEY secrets." >&2
            exit 1
          fi
          if [ -z "${VITE_STT_PROXY_URL:-}" ] || [ -z "${VITE_CHAT_PROXY_URL:-}" ]; then
            echo "Missing VITE_STT_PROXY_URL or VITE_CHAT_PROXY_URL secrets." >&2
            exit 1
          fi
          {
            echo "VITE_SUPABASE_URL=${VITE_SUPABASE_URL}"
            echo "VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}"
            echo "VITE_STT_PROXY_URL=${VITE_STT_PROXY_URL}"
            echo "VITE_CHAT_PROXY_URL=${VITE_CHAT_PROXY_URL}"
            echo "VITE_GROQ_MODEL=${VITE_GROQ_MODEL:-openai/gpt-oss-20b}"
            echo "VITE_GROQ_VISION_MODEL=${VITE_GROQ_VISION_MODEL:-qwen/qwen3.8-27b}"
            if [ -n "${VITE_GOOGLE_CLIENT_ID:-}" ]; then
              echo "VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}"
            fi
          } > .env
          if grep -Eiq 'GROQ_API_KEY|ALLOW_DIRECT_GROQ' .env; then
            echo "Refusing to build: client .env must not contain Groq secrets." >&2
            exit 1
          fi

      - name: Install frontend dependencies
        run: npm ci

      - name: Quality gates
        run: npm run ci:quality

      - name: Build macOS DMG
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri -- build --target "${{ matrix.target }}" --bundles dmg

      - name: Locate DMG
        id: dmg
        run: |
          shopt -s nullglob
          files=(src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No DMG found" >&2
            find src-tauri/target -name '*.dmg' -print || true
            exit 1
          fi
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: SystemBunny-macOS-${{ matrix.arch }}
          path: ${{ steps.dmg.outputs.path }}
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Apply release version
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
        run: node scripts/bump-version.mjs "${{ inputs.version }}"

      - name: Read app version
        id: ver
        run: echo "version=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Download Windows installers
        uses: actions/download-artifact@v4
        with:
          name: SystemBunny-Windows-x64
          path: dist/windows

      - name: Download macOS DMGs
        uses: actions/download-artifact@v4
        with:
          pattern: SystemBunny-macOS-*
          path: dist/macos
          merge-multiple: true

      - name: List release files
        run: |
          find dist -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' \) -print

      - name: Remove previous app-v* releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: app-v${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # Drop older installer releases so only the new version remains.
          mapfile -t tags < <(gh release list --limit 100 --json tagName -q '.[].tagName' || true)
          for tag in "${tags[@]:-}"; do
            [ -z "$tag" ] && continue
            case "$tag" in
              app-v*)
                if [ "$tag" != "$NEW_TAG" ]; then
                  echo "Deleting previous release $tag"
                  gh release delete "$tag" --yes --cleanup-tag || true
                fi
                ;;
            esac
          done

      - name: Create GitHub Release (latest only)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ steps.ver.outputs.version }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.note != '' && inputs.note || format('System Bunny v{0}', steps.ver.outputs.version) }}
          body: |
            ${{ github.event_name == 'workflow_dispatch' && inputs.note != '' && inputs.note || format('System Bunny v{0}', steps.ver.outputs.version) }}

            Desktop installers for this build.

            ### What’s in this release
            - Chat **Glass** slider — control overlay transparency during a session
            - Clearer **Check mic** help (Mac vs Windows steps, with a one-tap settings link)

            ### Windows
            - **Setup (.exe)** — NSIS installer (recommended)
            - **MSI** — WiX installer for enterprise / silent deploy
            - Requires WebView2 (usually preinstalled on Windows 10/11)

            ### macOS
            - **Apple Silicon** — filename contains `aarch64`
            - **Intel** — filename contains `x64` / `x86_64`
            - First open: right-click the app → **Open** if Gatekeeper blocks (ad-hoc signed until Developer ID notarization is wired)
            - If the mic is blocked: Check mic → follow the in-app Mac steps (Privacy & Security → Microphone)

            Previous `app-v*` releases are removed when this workflow publishes.
          files: |
            dist/windows/*.exe
            dist/windows/*.msi
            dist/macos/*.dmg
          fail_on_unmatched_files: false
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
